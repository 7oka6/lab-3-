name: Sequential Jobs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  first-job:
    name: First Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run first job
        run: |
          echo "Running first job..."
          # Add your commands here

  second-job:
    name: Second Job
    runs-on: ubuntu-latest
    needs: first-job

    steps:
      - name: Run second job
        run: |
          echo "First job succeeded. Running second job..."
          # Add your commands here
